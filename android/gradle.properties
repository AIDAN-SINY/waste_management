# Give the main build process 4GB of RAM
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Give the Kotlin Compiler specifically its own memory
kotlin.daemon.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m

# Optimize for stability
org.gradle.daemon=true
org.gradle.parallel=false
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Workaround: JVM inside Gradle could not resolve hosts (dl.google.com etc.)
# even though Windows DNS worked. Force IPv4 and give DNS a longer TTL.
systemProp.java.net.preferIPv4Stack=true
systemProp.networkaddress.cache.ttl=60
